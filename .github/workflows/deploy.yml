name: Deploy to Blacknight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Replace the CBUST token in every module import / asset URL with this
      # commit's short SHA, so each deploy ships brand-new cache keys. No more
      # hand-bumping ?v= or fighting the Cloudflare edge cache.
      - name: Stamp cache-bust version
        run: |
          STAMP="${GITHUB_SHA::8}"
          echo "Cache-bust stamp: $STAMP"
          find index.html src -type f \( -name '*.js' -o -name '*.html' \) \
            -exec sed -i "s/CBUST/${STAMP}/g" {} +
          echo "index.html now references:"
          grep -o '?v=[0-9a-f]\{8\}' index.html | sort -u || true

      - name: Upload site via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Target directory on the server. Set the FTP_DIR secret to the exact
          # path your FTP client shows for the site folder; defaults to ardri.
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null
          # Data channel sent in the clear (control stays TLS) + plain PASV to
          # avoid the FTPS data-channel hang in CI.
          TARGET="${FTP_DIR:-webspace/siteapps/WordPress-174457/htdocs/ardri}"
          echo "Deploying to: $TARGET"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<SCRIPT
          set ftp:ssl-force true
          set ftp:ssl-protect-data false
          set ssl:verify-certificate no
          set ftp:prefer-epsv false
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          mkdir -f -p "$TARGET"
          mirror --reverse --verbose --delete --continue \
            --exclude .git/ \
            --exclude .github/ \
            --exclude node_modules/ \
            --exclude docs/ \
            --exclude tools/ \
            --exclude-glob *.md \
            --exclude .preview.png \
            ./ "$TARGET"
          bye
          SCRIPT
