name: Deploy to Blacknight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Target directory on the server. Set the FTP_DIR secret to the exact
          # path your FTP client shows for the site folder; defaults to ardri.
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp >/dev/null
          # Data channel sent in the clear (control stays TLS) + plain PASV to
          # avoid the FTPS data-channel hang in CI.
          TARGET="${FTP_DIR:-webspace/httpdocs/ardri}"
          echo "Deploying to: $TARGET"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<SCRIPT
          set ftp:ssl-force true
          set ftp:ssl-protect-data false
          set ssl:verify-certificate no
          set ftp:prefer-epsv false
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          mkdir -f -p "$TARGET"
          mirror --reverse --verbose --delete --continue \
            --exclude .git/ \
            --exclude .github/ \
            --exclude node_modules/ \
            --exclude docs/ \
            --exclude tools/ \
            --exclude-glob *.md \
            --exclude .preview.png \
            ./ "$TARGET"
          bye
          SCRIPT
