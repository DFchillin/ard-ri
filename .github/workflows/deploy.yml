name: Deploy to Blacknight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Switch to `ftp` if Blacknight rejects FTPS on the first run.
          protocol: ftps
          # FTP account is chrooted into the web root, so the path is just the
          # subfolder. If files land in the wrong place, this is the line to edit.
          server-dir: ardri/
          # Only ship the playable site — not dev files.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            docs/**
            tools/**
            **/*.md
            .preview.png
